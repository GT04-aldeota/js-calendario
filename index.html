<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Gleidson Rocha">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu mês seu dia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
</head>

<body>
    <div class="flex flex-col justify-center items-center h-screen bg-slate-900">
        <h1 class="text-2xl text-white font-bold text-center">Descubra seu nome<br/> de Maromba</h1>
        <div class="flex gap-4 my-10">
            <div>
                <h2 class="font-bold uppercase text-white text-center">Escolha seu mês</h2>
                <select id="mes" class="border-2 border-white w-50 text-white"></select>
            </div>
            <div>
                <h2 class="font-bold uppercase text-white text-center">Escolha seu dia</h2>
                <select id="dia" class="border-2 border-white w-50 text-white"></select>
            </div>
        </div>
        <button onclick="descobrirNome()" class="leading-10 bg-white rounded-full px-10 duration-150 hover:bg-red-600 font-semibold cursor-pointer">Descobrir</button>
    </div>

    <script src="index.js"></script>
</body>

</html>
